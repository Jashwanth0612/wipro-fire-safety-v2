name: Website quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks with synthetic data
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/wipro-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/check-route-loading.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: python -m pytest backend/tests -q
      - run: pip-audit
